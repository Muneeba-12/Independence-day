<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <style>
      .pat-line { stroke: rgba(0, 255, 135, 0.08); stroke-width: 1; fill: none; }
      .pat-star { fill: rgba(255, 215, 0, 0.04); stroke: rgba(255, 215, 0, 0.12); stroke-width: 1; }
      .pat-accent { fill: rgba(0, 255, 135, 0.03); }
    </style>
  </defs>
  <!-- 8-pointed star and interlaced arabesque geometry -->
  <rect width="80" height="80" fill="transparent"/>
  <!-- Central 8-pointed star -->
  <polygon class="pat-star" points="40,20 45,30 55,25 50,35 60,40 50,45 55,55 45,50 40,60 35,50 25,55 30,45 20,40 30,35 25,25 35,30"/>
  <!-- Corner quarter stars -->
  <polygon class="pat-star" points="0,0 10,5 5,15 15,10 20,20 10,20 5,30 0,20"/>
  <polygon class="pat-star" points="80,0 70,5 75,15 65,10 60,20 70,20 75,30 80,20"/>
  <polygon class="pat-star" points="0,80 10,75 5,65 15,70 20,60 10,60 5,50 0,60"/>
  <polygon class="pat-star" points="80,80 70,75 75,65 65,70 60,60 70,60 75,50 80,60"/>
  <!-- Interlacing diagonal grid -->
  <line class="pat-line" x1="0" y1="40" x2="40" y2="0"/>
  <line class="pat-line" x1="40" y1="0" x2="80" y2="40"/>
  <line class="pat-line" x1="80" y1="40" x2="40" y2="80"/>
  <line class="pat-line" x1="40" y1="80" x2="0" y2="40"/>
  <line class="pat-line" x1="0" y1="0" x2="80" y2="80"/>
  <line class="pat-line" x1="80" y1="0" x2="0" y2="80"/>
</svg>
